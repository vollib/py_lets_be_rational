[tool.poetry]
name = "py_lets_be_rational"
version = "1.0.3"
description = "Pure python implementation of Peter Jaeckel's LetsBeRational."
authors = ["vollib <vollib@gammoncap.com>"]
license = "MIT"
readme = "README.md"
homepage = "http://jaeckel.org"
repository = "https://github.com/vollib/py_lets_be_rational"
packages = [{include = "py_lets_be_rational"}]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.20"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
